  <form method="post">
    {% csrf_token %}
    <div>
        <label>Username:</label>
        <input type="text" name="username" required>
    </div>

    <div>
        <label>Password:</label>
        <input type="password" name="password" required>
    </div>

    <input type="submit" value="Login">

    <br>

    <span style = 'color: red'> {{ error_msg }}</span>
    
  </form>

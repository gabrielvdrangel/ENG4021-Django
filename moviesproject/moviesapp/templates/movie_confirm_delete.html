{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Deletar filme</h2>
    <p>Tem certeza que deseja deletar "{{ movie.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirmar</button>
        <a class="btn" href="{% url 'home2' %}">Cancelar</a>
    </form>
</div>
{% endblock %}
